[workspace]
resolver = "2"
members = ["crates/model", "crates/evm", "crates/sim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"

[workspace.dependencies]
alloy-primitives = { version = "1.7", features = ["serde"] }
alloy-sol-types = "1.7"
revm = { version = "43", features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.9"
rand_chacha = "0.9"
csv = "1"
