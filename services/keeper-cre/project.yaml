# CRE project settings (generated layout from `cre init`, hello-world-ts). RPCs the workflow writes to.
staging-settings:
  rpcs:
    - chain-name: monad-testnet
      url: https://testnet-rpc.monad.xyz

# Ethereum Sepolia (config.sepolia.json, written by `DEPLOYMENT=sepolia pnpm sync-config` once deployments/sepolia.json
# exists).
sepolia-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

production-settings:
  rpcs:
    - chain-name: monad-testnet
      url: https://testnet-rpc.monad.xyz
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
