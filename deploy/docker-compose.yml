# Confluere web app + Caddy. From the repository root:
#   cp deploy/.env.example deploy/.env      # then edit
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Only Caddy publishes ports; the app is reachable on the internal network only.
name: confluere

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_CHAIN_ID: ${NEXT_PUBLIC_DEFAULT_CHAIN_ID:-998}
        NEXT_PUBLIC_RPC_URL_998: ${NEXT_PUBLIC_RPC_URL_998:-https://rpcs.chain.link/hyperevm/testnet}
        NEXT_PUBLIC_RPC_URL_10143: ${NEXT_PUBLIC_RPC_URL_10143:-https://testnet-rpc.monad.xyz}
        NEXT_PUBLIC_RPC_URL_11155111: ${NEXT_PUBLIC_RPC_URL_11155111:-https://ethereum-sepolia-rpc.publicnode.com}
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID:-}
    image: confluere-web:latest
    restart: unless-stopped
    environment:
      CONFLUERE_INDEX_DIR: /data
      # optional server-side log sources, "url|blockRange|concurrency,..." per chain
      LOGS_RPC_998: ${LOGS_RPC_998:-}
      LOGS_RPC_10143: ${LOGS_RPC_10143:-}
      LOGS_RPC_11155111: ${LOGS_RPC_11155111:-}
    volumes:
      - web-index:/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-app.confluere.xyz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  web-index:
  caddy-data:
  caddy-config:

networks:
  internal:
